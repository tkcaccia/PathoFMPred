name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Audit public licensing and fitted-object boundary
        run: Rscript tools/audit_public_release.R
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install pinned fastPLS
        run: |
          install.packages("float")
          archive <- tempfile(fileext = ".tar.gz")
          download.file(
            "https://codeload.github.com/tkcaccia/fastPLS/tar.gz/b518f75285c387632c2443a0c0989d75c9dcda48",
            archive,
            mode = "wb"
          )
          install.packages(archive, repos = NULL, type = "source")
        shell: Rscript {0}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"error"'
